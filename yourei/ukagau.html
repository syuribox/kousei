<h2>伺う / 窺う</h2>
<h3>伺う</h3>
伺：常用漢字<br>
質問をする、話を聞く、訪問する、などの語の丁寧語です。<br>
<br>
先生のお話を伺う。<br>
意見を伺う。<br>
意思を伺う。　意志を伺う。<br>
用事を伺う。<br>
明日の日程を伺う。<br>
お家へ伺う。<br>
ご機嫌伺い。<br>
お伺いに行きます。<br>
<h3>窺う</h3>
窺：常用漢字外<br>
様子を見る、という意味です。<br>
<br>
様子を窺う。　出方を窺う。<br>
タイミングを窺う。<br>
顔を窺う。　顔色を窺う。<br>
隙を窺う。<br>
気配を窺う。<br>
表情は窺えない。<br>
隙間から窺う。<br>
後ろを窺う。<br>
背後を窺う。<br>
<br>
