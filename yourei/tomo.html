<h2>供/共/友</h2>
<h3>供</h3>
常用漢字<br>
　子供、提供、供養<br>
※古くは子共とも書きましたが現代ではほぼ使いません。<br>
<br>
お供に連れる　お供を連れて<br>
供をつける<br>
<h3>共</h3>
常用漢字<br>
　共有、共用<br>
　共食い、共倒れ<br>
<br>
名実共に。<br>
新旧共に。<br>
右派と左派、共に歩み寄る。<br>
共に旅立つ。<br>
寝食を共にした仲<br>
<br>
<h3>友</h3>
常用漢字<br>
　友達、友人、友好<br>
　友引(ともびき)<br>
俺とお前は友だと思っている。<br>
心の友だよ。
